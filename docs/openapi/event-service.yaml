openapi: 3.0.3
info:
  title: Waltercraft Event Service
  version: 1.0.0
  description: Сервис игровых ивентов, фильтрации и участников сервера Waltercraft
servers:
  - url: /api/event-service
paths:
  /api/v1/events:
    get:
      operationId: listEvents
      summary: Получить список активных ивентов сервера с фильтрами
      description: Возвращает активные ивенты сервера, отфильтрованные по сезонам, организаторам, статусам и датам.
      security: []
      parameters:
        - name: seasons
          in: query
          description: Номера сезонов (например, 1, 2)
          schema:
            type: array
            items:
              type: integer
        - name: organizer
          in: query
          description: Никнеймы организаторов (один или несколько через запятую)
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: Статусы ивентов
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EventStatus'
        - name: dateFrom
          in: query
          description: Фильтр даты после (ISO-8601 YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: Фильтр даты до (ISO-8601 YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: search
          in: query
          description: Поисковый запрос
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Страница ивентов
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventSummaryResponse'
                  page:
                    $ref: '#/components/schemas/PageMetadata'

  /api/v1/events/{idOrCode}:
    get:
      operationId: getEvent
      summary: Получить подробную информацию об ивенте по ID или коду
      description: Возвращает полное описание ивента и список участников.
      security: []
      parameters:
        - name: idOrCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Подробная информация об ивенте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailResponse'
        '404':
          description: Ивент не найден

  /api/v1/events/filters:
    get:
      operationId: getEventFilters
      summary: Получить доступные опции фильтрации
      description: Возвращает списки сезонов, организаторов и статусов для фильтрации в сайдбаре.
      security: []
      responses:
        '200':
          description: Доступные опции фильтрации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventFiltersResponse'

  /api/v1/events/{id}/participate:
    post:
      operationId: participateEvent
      summary: Записаться участником на ивент
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: notes
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Успешная запись
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailResponse'
        '409':
          description: Уже записан или ивент не активен

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    EventStatus:
      type: string
      enum: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED]

    EventSummaryResponse:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        title:
          type: string
        shortDescription:
          type: string
        image:
          type: string
        seasonNumber:
          type: integer
        seasonTitle:
          type: string
        organizer:
          type: string
        status:
          $ref: '#/components/schemas/EventStatus'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        dateRangeFormatted:
          type: string
        participantsCount:
          type: integer
        displayOrder:
          type: integer
        active:
          type: boolean

    EventParticipantResponse:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: string
        role:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time

    EventDetailResponse:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        title:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        image:
          type: string
        seasonNumber:
          type: integer
        seasonTitle:
          type: string
        organizer:
          type: string
        status:
          $ref: '#/components/schemas/EventStatus'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        dateRangeFormatted:
          type: string
        participantsCount:
          type: integer
        participants:
          type: array
          items:
            $ref: '#/components/schemas/EventParticipantResponse'
        displayOrder:
          type: integer
        active:
          type: boolean
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EventFiltersResponse:
      type: object
      properties:
        seasons:
          type: array
          items:
            type: integer
        organizers:
          type: array
          items:
            type: string
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/EventStatus'
        minDate:
          type: string
          format: date
        maxDate:
          type: string
          format: date

    PageMetadata:
      type: object
      properties:
        size:
          type: integer
        number:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
