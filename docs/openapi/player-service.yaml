openapi: 3.0.3
info:
  title: Waltercraft Player Service
  version: 1.0.0
paths:
  /api/user/admins:
    get:
      operationId: listAdmins
      summary: Получить администрацию сервера
      description: Возвращает аккаунты пользователей с ролью ADMIN. UUID отсутствует у аккаунтов без лицензионного Minecraft-профиля.
      responses:
        '200':
          description: Список администрации
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProfileResponse'

  /api/season/me:
    get:
      operationId: getMySeasonParticipation
      summary: История участия текущего игрока в сезонах
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Сезоны, связанные с текущим профилем игрока
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonParticipationResponse'
        '401':
          description: Не авторизован или в access-токене отсутствует идентификатор игрока

  /api/user/admin/users:
    get:
      operationId: listAdminUsers
      summary: Список пользователей для админ-панели
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Пользователи с ролью, статусом и датой регистрации
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserResponse'
        '401':
          description: Не авторизован
        '403':
          description: Требуется роль ADMIN

  /api/user/admin/users/{id}:
    put:
      operationId: updateAdminUser
      summary: Изменить роль и статус пользователя
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
      responses:
        '200':
          description: Обновлённый пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '404':
          description: Пользователь не найден

  /api/user/admin/role-requests:
    get:
      operationId: listRoleRequests
      summary: Очередь заявок на роли
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Заявки, отсортированные по дате подачи (сначала новые)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleRequestResponse'

  /api/user/role-requests:
    post:
      operationId: submitRoleRequest
      summary: Подать заявку на роль MODERATOR или ADMIN
      description: Пользователь определяется по JWT. Одновременно может существовать только одна заявка со статусом PENDING.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequestRequest'
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRequestResponse'
        '400':
          description: Некорректная роль или сообщение
        '401':
          description: Требуется авторизация
        '409':
          description: У пользователя уже есть заявка на рассмотрении

  /api/user/admin/role-requests/{id}/approve:
    post:
      operationId: approveRoleRequest
      summary: Одобрить заявку и выдать запрошенную роль
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Рассмотренная заявка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRequestResponse'
        '404':
          description: Заявка не найдена
        '409':
          description: Заявка уже рассмотрена

  /api/user/admin/role-requests/{id}/reject:
    post:
      operationId: rejectRoleRequest
      summary: Отклонить заявку
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRejectRequest'
      responses:
        '200':
          description: Рассмотренная заявка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleRequestResponse'
        '404':
          description: Заявка не найдена
        '409':
          description: Заявка уже рассмотрена

  /api/user/{key}:
    delete:
      operationId: deleteUser
      summary: Удалить пользователя
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Пользователь удалён
        '404':
          description: Пользователь не найден

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AdminProfileResponse:
      type: object
      required:
        - username
        - uuid
      properties:
        username:
          type: string
          example: WaltercraftAdmin
        uuid:
          type: string
          format: uuid
          nullable: true

    SeasonParticipationResponse:
      type: object
      required: [playerId, totalSeasons, seasons]
      properties:
        playerId:
          type: integer
          format: int64
        totalSeasons:
          type: integer
          minimum: 0
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/SeasonEntry'

    SeasonEntry:
      type: object
      required: [id, title, phase]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        description:
          type: string
        image:
          type: string
          nullable: true
        phase:
          type: string
          enum: [UPCOMING, ACTIVE, COMPLETED, UNKNOWN]

    AdminUserResponse:
      type: object
      required:
        - id
        - username
        - displayName
        - email
        - role
        - status
        - registeredAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: LeadCone_TNF
        displayName:
          type: string
          example: LeadCone_TNF
        email:
          type: string
          example: lead@waltercraft.ru
        role:
          type: string
          enum: [USER, MODERATOR, ADMIN]
        status:
          type: string
          enum: [ACTIVE, BANNED, DEACTIVATED]
        registeredAt:
          type: string
          format: date
          example: "2024-02-11"

    AdminUserUpdateRequest:
      type: object
      required:
        - role
        - status
      properties:
        role:
          type: string
          enum: [USER, MODERATOR, ADMIN]
        status:
          type: string
          enum: [ACTIVE, BANNED, DEACTIVATED]

    RoleRequestResponse:
      type: object
      required:
        - id
        - applicantId
        - applicantName
        - applicantEmail
        - requestedRole
        - submittedAt
        - note
        - status
      properties:
        id:
          type: integer
          format: int64
        applicantId:
          type: integer
          format: int64
        applicantName:
          type: string
        applicantEmail:
          type: string
        requestedRole:
          type: string
          enum: [MODERATOR, ADMIN]
        submittedAt:
          type: string
          format: date-time
        note:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true

    CreateRoleRequestRequest:
      type: object
      required:
        - requestedRole
        - note
      properties:
        requestedRole:
          type: string
          enum: [MODERATOR, ADMIN]
        note:
          type: string
          minLength: 10
          maxLength: 2000

    RoleRejectRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 1000
