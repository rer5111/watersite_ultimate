openapi: 3.0.3
info:
  title: Waltercraft Player Service
  version: 1.0.0
paths:
  /api/user/admins:
    get:
      operationId: listAdmins
      summary: Получить администрацию сервера
      description: Возвращает аккаунты пользователей с ролью ADMIN. UUID отсутствует у аккаунтов без лицензионного Minecraft-профиля.
      responses:
        '200':
          description: Список администрации
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProfileResponse'
components:
  schemas:
    AdminProfileResponse:
      type: object
      required:
        - username
        - uuid
      properties:
        username:
          type: string
          example: WaltercraftAdmin
        uuid:
          type: string
          format: uuid
          nullable: true
