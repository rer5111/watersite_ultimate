server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${APPLICATION_DB_URL:jdbc:postgresql://${APPLICATION_DB_HOST:localhost}:${APPLICATION_DB_PORT:5432}/${APPLICATION_DB_NAME:application_db}}
    username: ${APPLICATION_DB_USER:application_user}
    password: ${APPLICATION_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    baseline-on-migrate: true
    validate-on-migrate: ${FLYWAY_VALIDATE:false}

application:
  jwt:
    jwk-set-uri: ${JWT_JWK_SET_URI:http://auth-service:8090/.well-known/jwks.json}
    issuer: ${AUTH_JWT_ISSUER:https://auth.waltercraft.ru}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
