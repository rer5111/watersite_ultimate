server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  datasource:
    url: ${DONATION_DB_URL:jdbc:postgresql://${DONATION_DB_HOST:localhost}:${DONATION_DB_PORT:5432}/${DONATION_DB_NAME:donation_db}}
    username: ${DONATION_DB_USER:donation_user}
    password: ${DONATION_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    baseline-on-migrate: true
    validate-on-migrate: ${FLYWAY_VALIDATE:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://auth-service:8090/.well-known/jwks.json}

donation:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:https://auth.waltercraft.ru}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
