spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          order: 5
          uri: lb://auth-service
          predicates:
            - Path=/api/auth-service/**
          filters:
            - StripPrefix=2
        - id: player-service
          order: 10
          uri: lb://player-service
          predicates:
            - Path=/api/player-service/**
          filters:
            - StripPrefix=2
        - id: application-service
          order: 12
          uri: lb://application-service
          predicates:
            - Path=/api/application-service/**
          filters:
            - StripPrefix=2
        - id: payment-service
          order: 14
          uri: lb://payment-service
          predicates:
            - Path=/api/payment-service/**
          filters:
            - StripPrefix=2
        - id: donation-service
          order: 15
          uri: lb://donation-service
          predicates:
            - Path=/api/donation-service/**
          filters:
            - StripPrefix=2
        - id: chat-service
          order: 16
          uri: lb://chat-service
          predicates:
            - Path=/api/chat-service/**
          filters:
            - StripPrefix=2
        - id: notification-service
          order: 18
          uri: lb://notification-service
          predicates:
            - Path=/api/notification-service/**
          filters:
            - StripPrefix=2
        - id: event-service
          order: 19
          uri: lb://event-service
          predicates:
            - Path=/api/event-service/**
          filters:
            - StripPrefix=2
        - id: skin-service
          order: 20
          uri: lb://skin-service
          predicates:
            - Path=/api/skin-service/**
          filters:
            - StripPrefix=2
        - id: frontend
          order: 100
          uri: http://frontend:80
          predicates:
            - Path=/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - http://localhost:*
              - http://127.0.0.1:*
              - ${FRONTEND_ORIGIN:http://localhost:5173}
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
            allowed-headers: '*'
            allow-credentials: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    version: 5.21.0
    disable-swagger-default-url: true
    persistAuthorization: true
    urls:
      - name: auth-service
        url: /api/auth-service/v3/api-docs
      - name: player-service
        url: /api/player-service/v3/api-docs
      - name: application-service
        url: /api/application-service/v3/api-docs
      - name: payment-service
        url: /api/payment-service/v3/api-docs
      - name: donation-service
        url: /api/donation-service/v3/api-docs
      - name: chat-service
        url: /api/chat-service/v3/api-docs
      - name: notification-service
        url: /api/notification-service/v3/api-docs
      - name: event-service
        url: /api/event-service/v3/api-docs
      - name: skin-service
        url: /api/skin-service/v3/api-docs
