spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          order: 5
          uri: lb://auth-service
          predicates:
            - Path=/api/auth-service/**
          filters:
            - StripPrefix=2
        - id: player-service
          order: 10
          uri: lb://player-service
          predicates:
            - Path=/api/player-service/**
          filters:
            - StripPrefix=2
        - id: application-service
          order: 12
          uri: lb://application-service
          predicates:
            - Path=/api/application-service/**
          filters:
            - StripPrefix=2
        - id: payment-service
          order: 14
          uri: lb://payment-service
          predicates:
            - Path=/api/payment-service/**
          filters:
            - StripPrefix=2
        - id: donation-service
          order: 15
          uri: lb://donation-service
          predicates:
            - Path=/api/donation-service/**
          filters:
            - StripPrefix=2
        - id: chat-service
          order: 16
          uri: lb://chat-service
          predicates:
            - Path=/api/chat-service/**
          filters:
            - StripPrefix=2
        - id: skin-service
          order: 20
          uri: lb://skin-service
          predicates:
            - Path=/api/skin-service/**
          filters:
            - StripPrefix=2
        - id: frontend
          order: 100
          uri: http://frontend:80
          predicates:
            - Path=/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS
            allowed-headers: '*'
            allow-credentials: true
