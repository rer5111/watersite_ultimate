server:
  forward-headers-strategy: framework

spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 10s
      routes:
        - id: auth-service
          order: 5
          uri: lb://auth-service
          predicates:
            - Path=/api/auth-service/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: authService
                fallbackUri: forward:/fallback/auth-service
                statusCodes:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
        - id: player-service
          order: 10
          uri: lb://player-service
          predicates:
            - Path=/api/player-service/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: playerService
                fallbackUri: forward:/fallback/player-service
                statusCodes:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
        - id: application-service
          order: 12
          uri: lb://application-service
          predicates:
            - Path=/api/application-service/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: applicationService
                fallbackUri: forward:/fallback/application-service
                statusCodes:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
        - id: payment-service
          order: 14
          uri: lb://payment-service
          predicates:
            - Path=/api/payment-service/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: paymentService
                fallbackUri: forward:/fallback/payment-service
