                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
        - id: donation-service
          order: 15
          uri: lb://donation-service
          predicates:
            - Path=/api/donation-service/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: donationService
                fallbackUri: forward:/fallback/donation-service
                statusCodes:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
        - id: chat-service
          order: 16
          uri: lb://chat-service
          predicates:
            - Path=/api/chat-service/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: chatService
                fallbackUri: forward:/fallback/chat-service
                statusCodes:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
        - id: notification-service
          order: 18
          uri: lb://notification-service
          predicates:
            - Path=/api/notification-service/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: notificationService
                fallbackUri: forward:/fallback/notification-service
                statusCodes:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
        - id: event-service
          order: 17
          uri: lb://event-service
          predicates:
            - Path=/api/event-service/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: eventService
                fallbackUri: forward:/fallback/event-service
                statusCodes:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
        - id: season-service
          order: 19
          uri: lb://season-service
          predicates:
            - Path=/api/season-service/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: seasonService
                fallbackUri: forward:/fallback/season-service
                statusCodes:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
        - id: skin-service
          order: 20
          uri: lb://skin-service
          predicates:
            - Path=/api/skin-service/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: skinService
                fallbackUri: forward:/fallback/skin-service
                statusCodes:
                  - BAD_GATEWAY
                  - GATEWAY_TIMEOUT
        - id: frontend
          order: 100
          uri: http://frontend:80
          predicates:
            - Path=/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - http://localhost:*
              - http://127.0.0.1:*
              - ${FRONTEND_ORIGIN:http://localhost:5173}
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
            allowed-headers: '*'
            allow-credentials: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    version: 5.21.0
    disable-swagger-default-url: true
    persistAuthorization: true
    urls:
      - name: auth-service
        url: /api/auth-service/v3/api-docs
      - name: player-service
        url: /api/player-service/v3/api-docs
      - name: application-service
        url: /api/application-service/v3/api-docs
      - name: payment-service
        url: /api/payment-service/v3/api-docs
      - name: donation-service
        url: /api/donation-service/v3/api-docs
      - name: chat-service
        url: /api/chat-service/v3/api-docs
      - name: notification-service
        url: /api/notification-service/v3/api-docs
      - name: event-service
        url: /api/event-service/v3/api-docs
      - name: season-service
        url: /api/season-service/v3/api-docs
      - name: skin-service
        url: /api/skin-service/v3/api-docs

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5s
    instances:
      authService:
        baseConfig: default
      playerService:
        baseConfig: default
      applicationService:
        baseConfig: default
      paymentService:
        baseConfig: default
      donationService:
        baseConfig: default
      chatService:
        baseConfig: default
      notificationService:
        baseConfig: default
      eventService:
        baseConfig: default
      seasonService:
        baseConfig: default
      skinService:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
        cancelRunningFuture: true
    instances:
      authService:
        baseConfig: default
      playerService:
        baseConfig: default
      applicationService:
        baseConfig: default
      paymentService:
        baseConfig: default
      donationService:
        baseConfig: default
      chatService:
        baseConfig: default
      notificationService:
        baseConfig: default
      eventService:
        baseConfig: default
      seasonService:
        baseConfig: default
      skinService:
        baseConfig: default
