server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://${NOTIFICATION_DB_HOST:notification-db}:${NOTIFICATION_DB_PORT:5432}/${NOTIFICATION_DB_NAME:notification_db}}
    username: ${NOTIFICATION_DB_USER:notification_user}
    password: ${NOTIFICATION_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  flyway:
    baseline-on-migrate: true
    validate-on-migrate: ${FLYWAY_VALIDATE:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://auth-service:8090/.well-known/jwks.json}
  mail:
    host: ${SMTP_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SMTP_PORT:${MAIL_PORT:465}}
    username: ${SMTP_USER:${MAIL_USERNAME:}}
    password: ${SMTP_PASS:${MAIL_PASSWORD:}}
    from: ${SMTP_FROM:${MAIL_FROM:Waltercraft <isip_k.f.bratuhin@mpt.ru>}}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*"
          starttls:
            enable: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

security:
  notification-service:
    shared-secret: ${NOTIFICATION_SERVICE_SHARED_SECRET}
    verification-code-pepper: ${VERIFICATION_CODE_PEPPER:waltercraft-default-verification-code-pepper-32-chars}

notification:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:https://auth.waltercraft.ru}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 3s
    instances:
      smtp:
        baseConfig: default
        recordExceptions:
          - com.waltercraft.notification.exception.EmailDeliveryUnavailableException
