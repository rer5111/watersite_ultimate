server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

spring:
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://${NOTIFICATION_DB_HOST:notification-db}:${NOTIFICATION_DB_PORT:5432}/${NOTIFICATION_DB_NAME:notification_db}}
    username: ${NOTIFICATION_DB_USER:notification_user}
    password: ${NOTIFICATION_DB_PASSWORD:0}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  flyway:
    baseline-on-migrate: true
    validate-on-migrate: ${FLYWAY_VALIDATE:false}
  mail:
    host: ${SMTP_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SMTP_PORT:${MAIL_PORT:465}}
    username: ${SMTP_USER:${MAIL_USERNAME:}}
    password: ${SMTP_PASS:${MAIL_PASSWORD:}}
    from: ${SMTP_FROM:${MAIL_FROM:Waltercraft <isip_k.f.bratuhin@mpt.ru>}}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*"
          starttls:
            enable: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

security:
  notification-service:
    shared-secret: ${NOTIFICATION_SERVICE_SHARED_SECRET:waltercraft-internal-auth-secret-key-32-chars}
