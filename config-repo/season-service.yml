server:
  port: ${SERVER_PORT:8088}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SEASON_DB_URL:jdbc:postgresql://${SEASON_DB_HOST:localhost}:${SEASON_DB_PORT:5432}/${SEASON_DB_NAME:season_db}}
    username: ${SEASON_DB_USER:season_user}
    password: ${SEASON_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    baseline-on-migrate: true
    validate-on-migrate: ${FLYWAY_VALIDATE:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://auth-service:8090/.well-known/jwks.json}

season:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:https://auth.waltercraft.ru}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
