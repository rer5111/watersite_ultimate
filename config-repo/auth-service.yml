server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:https://auth.waltercraft.ru}
    private-key-base64: ${AUTH_JWT_PRIVATE_KEY_BASE64:}
    allow-ephemeral-key: ${AUTH_JWT_ALLOW_EPHEMERAL_KEY:true}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P7D}
  microsoft:
    client-id: ${MICROSOFT_CLIENT_ID:}
    client-secret: ${MICROSOFT_CLIENT_SECRET:}
    redirect-uri: ${MICROSOFT_REDIRECT_URI:http://localhost:5173/auth/microsoft/callback}
    scopes: ${MICROSOFT_SCOPES:XboxLive.signin offline_access}

player-service:
  base-url: ${PLAYER_SERVICE_BASE_URL:http://localhost:8081}

notification-service:
  base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8087}

security:
  auth-service:
    shared-secret: ${AUTH_SERVICE_SHARED_SECRET}
  notification-service:
    shared-secret: ${NOTIFICATION_SERVICE_SHARED_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 3s
    instances:
      playerService:
        baseConfig: default
        recordExceptions:
          - com.waltercraft.auth.exception.PlayerServiceUnavailableException
      notificationService:
        baseConfig: default
        recordExceptions:
          - com.waltercraft.auth.exception.NotificationServiceUnavailableException
      minecraftOAuth:
        baseConfig: default
        recordExceptions:
          - com.waltercraft.auth.exception.MinecraftProviderUnavailableException
