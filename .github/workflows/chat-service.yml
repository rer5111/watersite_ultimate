name: chat-service

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chat-service.yml'
      - '.env.example'
      - 'microservices/chat-service/**'
      - 'config-repo/chat-service.yml'
      - 'config-repo/api-gateway.yml'
      - 'docker-compose.yml'
      - 'docs/openapi/chat-service.yaml'
      - 'microservices/api-gateway/src/main/java/org/example/apigateway/config/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/chat-service.yml'
      - '.env.example'
      - 'microservices/chat-service/**'
      - 'config-repo/chat-service.yml'
      - 'config-repo/api-gateway.yml'
      - 'docker-compose.yml'
      - 'docs/openapi/chat-service.yaml'
      - 'microservices/api-gateway/src/main/java/org/example/apigateway/config/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify chat-service
        working-directory: microservices/chat-service
        run: ./mvnw -B -ntp clean verify
