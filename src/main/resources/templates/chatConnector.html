<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<div class="navbar" style="background-color: rgb(21, 8, 53);">
    <div class="test" style="flex: 1 50%">
        <img src="WC-snow.png" width="64px" height="64px" class="icon">
        <h1 style="color:rgb(255, 255, 255); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Waltercraft</h1>
    </div>
    <div class = "test" style="flex:1 30%">
        <a href="/chat"><h3 class="navop">Игровой чат</h3></a>
        <a href="/adminPanel"><h3 class="navop">Панель администрации</h3></a>
        <a href="/"><h3 class="navop">Главная</h3></a>
        <a href="/players"><h3 class="navop">Наш состав</h3></a>
        <a href="/donate"><h3 class="navop">Пожертвование</h3></a>
        <a href="/login" th:if="${#httpServletRequest.remoteUser == null}">
            <h3 class="navop">Вход / Регистрация</h3>
        </a>

        <a href="/logout" th:if="${#httpServletRequest.remoteUser != null}">
            <h3 class="navop">Выход</h3>
        </a>
        <a href="https://discord.gg/gqrUH3hFhf"><img src="discord-white-icon.png" width="64px" height="64px" style="margin-left:2rem; margin-right: 2rem;"></a>
    </div>
</div>

<div style="margin: 3rem;">

    <div id="chat-display-window" style="
        border: 1px solid #333;
        border-radius: 8px 8px 0 0;
        height: 300px;
        overflow-y: scroll;
        padding: 10px;
        background-color: #000;
        color: #fff;
        text-align:left;
    ">
    </div>

    <form id="web-chat-form" style="
        display: flex;
        width: 100%;
    ">
        <input type="text" id="web-message" placeholder="Напишите сообщение..." required style="
            flex-grow: 1;
            background-color: #000;
            color: #fff;
            border: 1px solid #333;
            border-top: none;
            border-radius: 0 0 0 8px;
            padding: 10px;
            outline: none;
            font-size: 14px;
        ">

        <button type="submit" style="
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            border-top: none;
            border-left: none;
            border-radius: 0 0 8px 0;
            padding: 0 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        " onmouseover="this.style.backgroundColor='#2a2a2a'" onmouseout="this.style.backgroundColor='#1a1a1a'">
            Send
        </button>
    </form>

</div>

<script>
    const socket = new SockJS('http://localhost:8080/ws-minecraft');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        console.log('Successfully connected to the Minecraft live stream line!');
        stompClient.subscribe('/topic/chat', function (response) {
            const chatPayload = JSON.parse(response.body);
            const chatBox = document.getElementById("chat-display-window");
            chatBox.innerHTML += `<p style="text-align: left !important; margin: 4px 0; width: 100%;"><strong>${chatPayload.user}:</strong> ${chatPayload.message}</p>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    });
    document.getElementById('web-chat-form').addEventListener('submit', async function(event) {
        event.preventDefault();

        const messageInput = document.getElementById('web-message');
        const message = messageInput.value;

        const formData = new URLSearchParams();
        formData.append('message', message);

        try {
            const response = await fetch('http://localhost:8080/api/minecraft-chat/send', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            });

            if (response.ok) {
                messageInput.value = '';
            }
        } catch (error) {
            console.error("Communication error:", error);
        }
    });
</script>
</body>
</html>
