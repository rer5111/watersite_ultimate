server.port=${SERVER_PORT:8888}

spring.application.name=configServer
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_LOCATION:file:../../config-repo},classpath:/configs

spring.cloud.config.server.overrides.spring.cloud.config.enabled=false

spring.cloud.config.server.encrypt.enabled=false
management.endpoints.web.exposure.include=health,info
