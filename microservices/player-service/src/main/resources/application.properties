server.port=${SERVER_PORT:8081}
spring.application.name=player-service

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.datasource.url=jdbc:postgresql://${PLAYER_DB_HOST:${DB_HOST:localhost}}:${PLAYER_DB_PORT:${DB_PORT:5432}}/${PLAYER_DB_NAME:${DB_NAME:player_db}}
spring.datasource.username=${PLAYER_DB_USER:${DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}}
spring.datasource.password=${PLAYER_DB_PASSWORD:${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:0}}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database=POSTGRESQL

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.placeholders.adminPasswordHash=${ADMIN_INITIAL_PASSWORD_HASH:*LOCKED*}

spring.security.user.name=${SECURITY_USER_NAME:user}
spring.security.user.password=${SECURITY_USER_PASSWORD:}
security.auth-service.shared-secret=${AUTH_SERVICE_SHARED_SECRET:}
management.endpoints.web.exposure.include=health,info
