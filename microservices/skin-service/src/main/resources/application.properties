server.port=${SERVER_PORT:8082}
server.forward-headers-strategy=framework
spring.application.name=skin-service

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

skin.provider.vzge-url=${VZGE_BASE_URL:https://vzge.me}
skin.provider.crafatar-url=${CRAFATAR_BASE_URL:https://crafatar.com}
skin.provider.visage-url=${VISAGE_BASE_URL:https://visage.surgeplay.com}
skin.provider.user-agent=WaltercraftSkinService/1.0 (+https://waltercraft.ru)
skin.provider.cache-ttl-minutes=1440
skin.provider.connect-timeout-ms=3000
skin.provider.read-timeout-ms=5000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false
logging.structured.format.console=logstash

resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=50
resilience4j.circuitbreaker.configs.default.slowCallDurationThreshold=3s
