services:
  player-db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${PLAYER_DB_NAME:-player_db}
      POSTGRES_USER: ${PLAYER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD:-0}
    volumes:
      - player-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-player_db}"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  donation-db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${DONATION_DB_NAME:-donation_db}
      POSTGRES_USER: ${DONATION_DB_USER:-donation_user}
      POSTGRES_PASSWORD: ${DONATION_DB_PASSWORD:?Set DONATION_DB_PASSWORD in .env}
    volumes:
      - donation-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  application-db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${APPLICATION_DB_NAME:-application_db}
      POSTGRES_USER: ${APPLICATION_DB_USER:-application_user}
      POSTGRES_PASSWORD: ${APPLICATION_DB_PASSWORD:?Set APPLICATION_DB_PASSWORD in .env}
    volumes:
      - application-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  payment-db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment_db}
      POSTGRES_USER: ${PAYMENT_DB_USER:-payment_user}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  notification-db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification_db}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notification_user}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  event-db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${EVENT_DB_NAME:-event_db}
      POSTGRES_USER: ${EVENT_DB_USER:-event_user}
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD:?Set EVENT_DB_PASSWORD in .env}
    volumes:
      - event-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  config-server:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_DIR: microservices/config-server
    volumes:
      - ./config-repo:/config-repo:ro,Z
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8888/actuator/health']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_DIR: microservices/discovery-server
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: 'false'
      EUREKA_CLIENT_FETCH_REGISTRY: 'false'
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:-http://localhost:8761/eureka/}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    ports:
      - '8761:8761'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8761/actuator/health']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  player-service:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_DIR: microservices/player-service
    depends_on:
      player-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      DB_HOST: ${PLAYER_DB_HOST:-player-db}
      DB_PORT: ${PLAYER_DB_PORT:-5432}
      DB_NAME: ${PLAYER_DB_NAME:-player_db}
      DB_USER: ${PLAYER_DB_USER:-postgres}
      DB_PASSWORD: ${PLAYER_DB_PASSWORD:-0}
      ADMIN_INITIAL_PASSWORD_HASH: ${ADMIN_INITIAL_PASSWORD_HASH:-*LOCKED*}
      AUTH_SERVICE_SHARED_SECRET: ${AUTH_SERVICE_SHARED_SECRET:-}
      JWT_JWK_SET_URI: http://auth-service:8090/.well-known/jwks.json
      SECURITY_USER_NAME: ${PLAYER_SERVICE_USER:-user}
      SECURITY_USER_PASSWORD: ${PLAYER_SERVICE_PASSWORD:-}
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'true'
      CONFIG_SERVER_URL: http://config-server:8888
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8081/api/user/admins']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_DIR: microservices/auth-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      player-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8090
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      PLAYER_SERVICE_BASE_URL: http://player-service:8081
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:8087
      NOTIFICATION_SERVICE_SHARED_SECRET: ${NOTIFICATION_SERVICE_SHARED_SECRET:-waltercraft-internal-auth-secret-key-32-chars}
      AUTH_SERVICE_SHARED_SECRET: ${AUTH_SERVICE_SHARED_SECRET:-}
      AUTH_JWT_PRIVATE_KEY_BASE64: ${AUTH_JWT_PRIVATE_KEY_BASE64:-}
      AUTH_JWT_ALLOW_EPHEMERAL_KEY: ${AUTH_JWT_ALLOW_EPHEMERAL_KEY:-true}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.waltercraft.ru}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-PT15M}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-P7D}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:5173/auth/microsoft/callback}
      MICROSOFT_SCOPES: ${MICROSOFT_SCOPES:-XboxLive.signin offline_access}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8090/actuator/health']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  skin-service:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_DIR: microservices/skin-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8082/actuator/health']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  donation-service:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_DIR: microservices/donation-service
    depends_on:
      donation-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      DONATION_DB_HOST: ${DONATION_DB_HOST:-donation-db}
      DONATION_DB_PORT: ${DONATION_DB_PORT:-5432}
      DONATION_DB_NAME: ${DONATION_DB_NAME:-donation_db}
      DONATION_DB_USER: ${DONATION_DB_USER:-donation_user}
      DONATION_DB_PASSWORD: ${DONATION_DB_PASSWORD:?Set DONATION_DB_PASSWORD in .env}
      JWT_JWK_SET_URI: http://auth-service:8090/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.waltercraft.ru}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          'http://localhost:8083/actuator/health/readiness',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  application-service:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_DIR: microservices/application-service
    depends_on:
      application-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      APPLICATION_DB_HOST: ${APPLICATION_DB_HOST:-application-db}
      APPLICATION_DB_PORT: ${APPLICATION_DB_PORT:-5432}
      APPLICATION_DB_NAME: ${APPLICATION_DB_NAME:-application_db}
      APPLICATION_DB_USER: ${APPLICATION_DB_USER:-application_user}
      APPLICATION_DB_PASSWORD: ${APPLICATION_DB_PASSWORD:?Set APPLICATION_DB_PASSWORD in .env}
      JWT_JWK_SET_URI: http://auth-service:8090/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.waltercraft.ru}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          'http://localhost:8084/actuator/health/readiness',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_DIR: microservices/payment-service
    depends_on:
      payment-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      PAYMENT_DB_HOST: ${PAYMENT_DB_HOST:-payment-db}
      PAYMENT_DB_PORT: ${PAYMENT_DB_PORT:-5432}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-payment_user}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
      JWT_JWK_SET_URI: http://auth-service:8090/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.waltercraft.ru}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          'http://localhost:8085/actuator/health/readiness',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_DIR: microservices/chat-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8086
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_JWK_SET_URI: http://auth-service:8090/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.waltercraft.ru}
      DISCORD_BOT_ENABLED: ${DISCORD_BOT_ENABLED:-false}
      DISCORD_BOT_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CHAT_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_MINECRAFT_BOT_USER_ID: ${DISCORD_MINECRAFT_BOT_USER_ID:-1042883408596062298}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          'http://localhost:8086/actuator/health/readiness',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_DIR: microservices/notification-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      notification-db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8087
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      NOTIFICATION_DB_HOST: notification-db
      NOTIFICATION_DB_PORT: 5432
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification_db}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-notification_user}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-0}
      NOTIFICATION_SERVICE_SHARED_SECRET: ${NOTIFICATION_SERVICE_SHARED_SECRET:-waltercraft-internal-auth-secret-key-32-chars}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.waltercraft.ru}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://auth-service:8090/.well-known/jwks.json}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Waltercraft <isip_k.f.bratuhin@mpt.ru>}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          'http://localhost:8087/actuator/health/readiness',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  event-service:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_DIR: microservices/event-service
    depends_on:
      event-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8088
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EVENT_DB_HOST: ${EVENT_DB_HOST:-event-db}
      EVENT_DB_PORT: ${EVENT_DB_PORT:-5432}
      EVENT_DB_NAME: ${EVENT_DB_NAME:-event_db}
      EVENT_DB_USER: ${EVENT_DB_USER:-event_user}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD:?Set EVENT_DB_PASSWORD in .env}
      JWT_JWK_SET_URI: http://auth-service:8090/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.waltercraft.ru}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          'http://localhost:8088/actuator/health/readiness',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_DIR: microservices/api-gateway
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      player-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      skin-service:
        condition: service_healthy
      donation-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: 5
      FRONTEND_ORIGIN: http://localhost:8080
      GATEWAY_JWT_ENABLED: ${GATEWAY_JWT_ENABLED:-true}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://auth-service:8090/.well-known/jwks.json}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/actuator/health']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080

volumes:
  player-db-data:
  donation-db-data:
  application-db-data:
  payment-db-data:
  notification-db-data:
  event-db-data:
